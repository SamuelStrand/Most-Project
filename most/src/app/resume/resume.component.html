<div class="resume-container">
    <div *ngIf="isLoading" class="loading-spinner">
        Loading...
    </div>
    <div *ngIf="resume && !isLoading">
        <h1>Your Resume</h1>
        <div *ngIf="!isEditing" class="resume-view">
            <h2>{{ resume.title }}</h2>
            <div class="resume-section">
                <h3>Summary</h3>
                <p>{{ resume.summary }}</p>
            </div>
            
            <div class="resume-section" *ngIf="resume.experience">
                <h3>Experience</h3>
                <p>{{ resume.experience }}</p>
            </div>
            
            <div class="resume-section" *ngIf="resume.education">
                <h3>Education</h3>
                <p>{{ resume.education }}</p>
            </div>
            
            <button (click)="toggleEdit()" class="edit-button">Edit Resume</button>
        </div>
        <button *ngIf="resume" (click)="deleteResume()" [disabled]="isLoading" class="btn btn-danger">
            Delete Resume
          </button>
    
        <form *ngIf="isEditing" (ngSubmit)="updateResume()" class="resume-form">
            <div class="form-group">
                <label for="title">Title:</label>
                <input id="title" [(ngModel)]="formData.title" name="title" required>
            </div>
            
            <div class="form-group">
                <label for="summary">Summary:</label>
                <textarea id="summary" [(ngModel)]="formData.summary" name="summary" required rows="4"></textarea>
            </div>
            
            <div class="form-group">
                <label for="experience">Experience:</label>
                <textarea id="experience" [(ngModel)]="formData.experience" name="experience" rows="6"></textarea>
            </div>
            
            <div class="form-group">
                <label for="education">Education:</label>
                <textarea id="education" [(ngModel)]="formData.education" name="education" rows="4"></textarea>
            </div>
            
            <div class="form-actions">
                <button type="submit" [disabled]="isLoading || formData.title.length < 3 || !formData.summary">
                    Save Changes
                </button>
                <button type="button" (click)="toggleEdit()" [disabled]="isLoading">
                    Cancel
                </button>
            </div>
        </form>
    </div>
    <div *ngIf="!resume && !isLoading">
        <h1>Create Your Resume</h1>
        <p>You don't have a resume yet. Create one to start applying for jobs!</p>
        
        <button *ngIf="!isEditing" (click)="toggleCreateForm()" class="create-button">
            Create Resume
        </button>
        
        <form *ngIf="isEditing" (ngSubmit)="submitForm()" class="resume-form">
            <div class="form-group">
                <label for="new-title">Title:</label>
                <input id="new-title" [(ngModel)]="formData.title" name="title" required>
            </div>
            
            <div class="form-group">
                <label for="new-summary">Summary:</label>
                <textarea id="new-summary" [(ngModel)]="formData.summary" name="summary" required rows="4"></textarea>
            </div>
            
            <div class="form-group">
                <label for="new-experience">Experience:</label>
                <textarea id="new-experience" [(ngModel)]="formData.experience" name="experience" rows="6"></textarea>
            </div>
            
            <div class="form-group">
                <label for="new-education">Education:</label>
                <textarea id="new-education" [(ngModel)]="formData.education" name="education" rows="4"></textarea>
            </div>
            
            <div class="form-actions">
                <button type="submit" [disabled]="isLoading || formData.title.length < 3 || !formData.summary">
                    Create Resume
                </button>
                <button type="button" (click)="isEditing = false" [disabled]="isLoading">
                    Cancel
                </button>
                
            </div>
            
        </form>
    </div>
    <div class="error-message" *ngIf="errorMessage">
        <p>{{ errorMessage }}</p>
    </div>
</div>
